<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>Objects social card template</title>
<style>
@font-face { font-family: Inter; src: url('../assets/fonts/inter-var-latin.woff2'); }
@font-face { font-family: Serif; src: url('../assets/fonts/sourceserif4-var-latin.woff2'); }
* { box-sizing: border-box; } body { margin:0; width:1200px; height:630px; background:#f1f0ee; color:#171716; font-family:Inter,sans-serif; padding:38px 64px; }

</style></head><body><header><span class="brand"><img src="../assets/img/logo-mark.png" alt="">Nicolas Pieper</span><span class="url">nicolaspieper.com/objects</span></header><h1>Objects, chosen.</h1><p class="intro">The things I own and love. The things on my wishlist.</p><div class="objects"><div class="object"><img src="../assets/img/objects/herman-miller-cosm.webp" alt="Herman Miller Cosm"></div><div class="object"><img src="../assets/img/objects/gozney-dome-2.webp" alt="Gozney Dome 2"></div><div class="object"><img src="../assets/img/objects/devialet-phantom-opera.webp" alt="Devialet Phantom Ultimate"></div></div><footer>A personal collection</footer><script>if(new URLSearchParams(location.search).get('lang')==='fr'){document.documentElement.lang='fr';document.querySelector('h1').textContent='Objets choisis.';document.querySelector('.intro').textContent='Les objets que j’ai et que j’adore. Ceux dont j’ai envie.';document.querySelector('.url').textContent='nicolaspieper.com/fr/objects';document.querySelector('footer').textContent='Une collection personnelle';}</script></body></html>
