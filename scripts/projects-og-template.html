<!DOCTYPE html>
<!-- Gabarit de projects-social-card.jpg (1200x630).
     Rendu par scripts/generate-projects-og-image.sh avec les actifs locaux. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<style>
  @font-face {
    font-family: 'Inter';
    font-weight: 100 900;
    src: url('../assets/fonts/inter-var-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Source Serif 4';
    font-weight: 100 900;
    src: url('../assets/fonts/sourceserif4-var-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono';
    font-weight: 100 800;
    src: url('../assets/fonts/jetbrainsmono-var-latin.woff2') format('woff2');
  }
  * { box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { background: #FAF9F5; color: #171716; font-family: 'Inter', sans-serif; }
  .bar { height: 14px; background: #FF4F00; }
  .canvas {
    display: grid;
    grid-template-columns: 440px 1fr;
    gap: 64px;
    height: 616px;
    padding: 62px 72px 54px 82px;
  }
  .intro { display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 15px; margin-bottom: 70px; }
  .brand img { width: 52px; height: 52px; border-radius: 7px; }
  .brand span { font-size: 22px; font-weight: 650; }
  .eyebrow {
    margin: 0 0 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #C23C00;
  }
  h1 {
    margin: 0;
    font-family: 'Source Serif 4', serif;
    font-size: 92px;
    font-weight: 650;
    line-height: 0.98;
    letter-spacing: -0.025em;
  }
  .tagline { margin: 28px 0 0; max-width: 390px; font-size: 27px; line-height: 1.3; color: #45443F; }
  .url {
    margin: auto 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    color: #66655E;
  }
  .ledger { align-self: center; border-top: 1px solid #CFCCC0; border-bottom: 1px solid #CFCCC0; }
  .project {
    display: grid;
    grid-template-columns: 45px 1fr;
    align-items: center;
    min-height: 89px;
    border-top: 1px solid #E3E1D7;
  }
  .project:first-child { border-top: 0; }
  .number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 650;
    color: #C23C00;
  }
  .logo-frame {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 64px;
    padding: 4px 20px;
    background: #FFFFFF;
    border: 1px solid #E3E1D7;
    border-radius: 4px;
  }
  .logo-frame img { display: block; width: auto; max-width: 260px; max-height: 42px; object-fit: contain; }
  .logo-frame img.logo-large { max-height: 54px; }
  .logo-frame .monflorian-lockup {
    display: grid;
    grid-template-columns: minmax(0, 0.58fr) minmax(0, 1fr);
    align-items: center;
    gap: 3px;
    width: 170px;
  }
  .logo-frame .monflorian-lockup img {
    width: 100%;
    max-width: none;
    max-height: none;
    height: auto;
  }
  .foundation {
    display: flex;
    justify-content: flex-end;
    margin-top: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #66655E;
  }
  .foundation::before { content: '$ '; margin-right: 5px; color: #FF4F00; }
</style>
</head>
<body>
  <div class="bar"></div>
  <main class="canvas">
    <section class="intro">
      <div class="brand"><img src="../assets/img/logo-mark.png" alt=""><span>Nicolas Pieper</span></div>
      <p class="eyebrow" id="eyebrow">From idea to production</p>
      <h1 id="title">Projects.</h1>
      <p class="tagline" id="tagline">Web products and engineering systems, led and verified by a human.</p>
      <p class="url" id="url">nicolaspieper.com/projects</p>
    </section>
    <section aria-label="Five products">
      <div class="ledger">
        <div class="project"><span class="number">01</span><div class="logo-frame"><img src="../assets/img/projects/surplasse-logo.webp" alt=""></div></div>
        <div class="project"><span class="number">02</span><div class="logo-frame"><img class="logo-large" src="../assets/img/projects/papers-empire-logo.webp" alt=""></div></div>
        <div class="project"><span class="number">03</span><div class="logo-frame"><img class="logo-large" src="../assets/img/projects/parkventory-logo.svg" alt=""></div></div>
        <div class="project"><span class="number">04</span><div class="logo-frame"><img class="logo-large" src="../assets/img/projects/fouranu-logo.png" alt=""></div></div>
        <div class="project"><span class="number">05</span><div class="logo-frame"><span class="monflorian-lockup" aria-hidden="true"><img src="../assets/img/projects/monflorian-avatar-v2.webp" alt=""><img src="../assets/img/projects/monflorian-wordmark.webp" alt=""></span></div></div>
      </div>
      <div class="foundation">FOUNDATION.md</div>
    </section>
  </main>
  <script>
    if (new URLSearchParams(window.location.search).get('lang') === 'fr') {
      document.documentElement.lang = 'fr';
      document.getElementById('eyebrow').textContent = 'De l’idée à la production';
      document.getElementById('title').textContent = 'Projets.';
      document.getElementById('tagline').textContent = 'Produits web et systèmes d’ingénierie, pilotés et vérifiés par un humain.';
      document.getElementById('url').textContent = 'nicolaspieper.com/fr/projects';
    }
  </script>
</body>
</html>
