<!DOCTYPE html>
<!-- Gabarit des cartes de partage principales (1200x630).
     Paramètres: ?page=home|work|cv|blog|claude|roadtrip&lang=en|fr.
     Rendu par scripts/generate-og-image.sh avec les actifs locaux. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<style>
  @font-face {
    font-family: 'Inter';
    font-weight: 100 900;
    src: url('../assets/fonts/inter-var-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Source Serif 4';
    font-weight: 100 900;
    src: url('../assets/fonts/sourceserif4-var-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono';
    font-weight: 100 800;
    src: url('../assets/fonts/jetbrainsmono-var-latin.woff2') format('woff2');
  }
  * { box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body {
    background: #FAF9F5;
    color: #171716;
    font-family: 'Inter', sans-serif;
  }
  .bar { height: 14px; background: #FF4F00; }
  .card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 54px;
    height: 616px;
    padding: 58px 76px 50px 82px;
  }
  .copy { display: flex; min-width: 0; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 15px; margin-bottom: 55px; }
  .brand img { width: 52px; height: 52px; border-radius: 7px; }
  .brand span { font-size: 22px; font-weight: 680; }
  .eyebrow {
    margin: 0 0 13px;
    color: #C23C00;
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight: 680;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  h1 {
    max-width: 700px;
    margin: 0;
    font-family: 'Source Serif 4', serif;
    font-size: 82px;
    font-weight: 650;
    letter-spacing: -0.025em;
    line-height: 0.98;
  }
  body[data-page="home"] h1 { font-size: 86px; }
  .tagline {
    max-width: 670px;
    margin: 25px 0 0;
    color: #45443F;
    font-size: 28px;
    line-height: 1.3;
  }
  .detail {
    margin: auto 0 0;
    color: #C23C00;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 650;
    letter-spacing: 0.01em;
  }
  .url {
    margin: 10px 0 0;
    color: #66655E;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
  }
  .visual {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }
  .visual > * { display: none; }
  body[data-page="home"] .home-portrait,
  body[data-page="work"] .work-collage,
  body[data-page="cv"] .cv-photo,
  body[data-page="blog"] .blog-stack,
  body[data-page="claude"] .claude-photo,
  body[data-page="roadtrip"] .claude-photo { display: block; }
  .home-portrait {
    width: 306px;
    filter: drop-shadow(0 14px 34px rgba(23, 23, 22, 0.2));
  }
  .cv-photo {
    width: 300px;
    height: 390px;
    border: 12px solid #FFFFFF;
    border-bottom-width: 48px;
    box-shadow: 0 18px 44px rgba(23, 23, 22, 0.16);
    object-fit: cover;
    object-position: 50% 24%;
    transform: rotate(1.5deg);
  }
  .work-collage { position: relative; width: 330px; height: 430px; }
  .work-collage img {
    position: absolute;
    width: 190px;
    filter: drop-shadow(0 10px 22px rgba(23, 23, 22, 0.14));
  }
  .work-collage img:nth-child(1) { left: -4px; top: 4px; transform: rotate(-5deg); }
  .work-collage img:nth-child(2) { right: -5px; top: 112px; transform: rotate(5deg); }
  .work-collage img:nth-child(3) { left: 7px; bottom: -2px; transform: rotate(2deg); }
  .blog-stack { position: relative; width: 330px; height: 430px; }
  .blog-stack img {
    position: absolute;
    width: 276px;
    height: 184px;
    border: 8px solid #FFFFFF;
    background: #FFFFFF;
    box-shadow: 0 16px 34px rgba(23, 23, 22, 0.14);
    object-fit: cover;
  }
  .blog-stack img:nth-child(1) { left: 4px; top: 6px; transform: rotate(-4deg); }
  .blog-stack img:nth-child(2) { right: 0; top: 125px; transform: rotate(4deg); }
  .blog-stack img:nth-child(3) { left: 13px; bottom: 2px; transform: rotate(-1.5deg); }
  .claude-photo {
    width: 320px;
    height: 430px;
    border: 10px solid #EEE7D8;
    border-radius: 3px;
    box-shadow: 0 18px 42px rgba(23, 23, 22, 0.18);
    object-fit: cover;
    transform: rotate(1.5deg);
  }
</style>
</head>
<body data-page="home">
  <div class="bar"></div>
  <main class="card">
    <section class="copy">
      <div class="brand"><img src="../assets/img/logo-mark.png" alt=""><span>Nicolas Pieper</span></div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="tagline" id="tagline"></p>
      <p class="detail" id="detail"></p>
      <p class="url" id="url"></p>
    </section>
    <aside class="visual" aria-hidden="true">
      <img class="home-portrait" src="../assets/img/nicolas-sticker.png" alt="">
      <div class="work-collage">
        <img src="../assets/img/solutions-sticker.png" alt="">
        <img src="../assets/img/iot-sticker.png" alt="">
        <img src="../assets/img/documentfactory-sticker.png" alt="">
      </div>
      <img class="cv-photo" src="../assets/img/nicolas-pieper.jpg" alt="">
      <div class="blog-stack">
        <img src="../assets/img/blog/growing-up-with-the-web-og.jpg" alt="">
        <img src="../assets/img/blog/ai-coding-agents-logging-og.jpg" alt="">
        <img src="../assets/img/blog/organizing-the-solutions-team-og.jpg" alt="">
      </div>
      <img class="claude-photo" src="../claude/roadtrip-austria-2026/assets/schlegeis-nicolas-pampy-real.webp" alt="">
    </aside>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const page = ['home', 'work', 'cv', 'blog', 'claude', 'roadtrip'].includes(params.get('page')) ? params.get('page') : 'home';
    const lang = params.get('lang') === 'fr' ? 'fr' : 'en';
    const cards = {
      en: {
        home: {
          eyebrow: 'Engineering Manager · Luxembourg',
          title: 'Nicolas Pieper',
          tagline: 'Building secure platforms that scale.',
          detail: '1M+ devices · 10M reports/month · 10 engineers',
          url: 'nicolaspieper.com'
        },
        work: {
          eyebrow: 'Engineering leadership',
          title: 'Inside the platforms.',
          tagline: 'Leadership and case studies from secure platforms at scale.',
          detail: 'IoT · documents · secure communications',
          url: 'nicolaspieper.com/work'
        },
        cv: {
          eyebrow: 'Curriculum vitae',
          title: 'Nicolas Pieper',
          tagline: 'Engineering Manager in Luxembourg.',
          detail: 'Experience · skills · education · languages',
          url: 'nicolaspieper.com/cv'
        },
        blog: {
          eyebrow: 'Engineering and personal notes',
          title: 'Notes from practice.',
          tagline: 'Engineering, AI and the web that shaped how I build.',
          detail: '6 articles · English and French',
          url: 'nicolaspieper.com/blog'
        }
      },
      fr: {
        home: {
          eyebrow: 'Engineering Manager · Luxembourg',
          title: 'Nicolas Pieper',
          tagline: 'Construire des plateformes sécurisées à grande échelle.',
          detail: '1 M+ d’appareils · 10 M de rapports/mois · 10 ingénieurs',
          url: 'nicolaspieper.com/fr'
        },
        work: {
          eyebrow: 'Leadership d’ingénierie',
          title: 'Dans les coulisses.',
          tagline: 'Leadership et études de cas sur des plateformes sécurisées à grande échelle.',
          detail: 'IoT · documents · communications sécurisées',
          url: 'nicolaspieper.com/fr/work'
        },
        cv: {
          eyebrow: 'Curriculum vitae',
          title: 'Nicolas Pieper',
          tagline: 'Engineering Manager au Luxembourg.',
          detail: 'Expérience · compétences · formation · langues',
          url: 'nicolaspieper.com/fr/cv'
        },
        blog: {
          eyebrow: 'Notes d’ingénierie et personnelles',
          title: 'Notes de pratique.',
          tagline: 'Ingénierie, IA et le web qui a façonné ma pratique.',
          detail: '6 articles · français et anglais',
          url: 'nicolaspieper.com/fr/blog'
        },
        claude: {
          eyebrow: 'Carnet personnel',
          title: '/claude',
          tagline: 'Photos, notes et petites expériences web.',
          detail: 'Autriche 2026 · Nicolas et Pampy',
          url: 'nicolaspieper.com/claude'
        },
        roadtrip: {
          eyebrow: 'Carnet photo',
          title: 'Autriche 2026.',
          tagline: 'Quelques jours sur la route avec Pampy et les Alpes devant.',
          detail: 'Tux · Schlegeis · Krimml · Grossglockner · Gosau',
          url: 'nicolaspieper.com/claude/roadtrip-austria-2026'
        }
      }
    };
    const resolvedLang = ['claude', 'roadtrip'].includes(page) ? 'fr' : lang;
    const card = cards[resolvedLang][page];
    document.documentElement.lang = resolvedLang;
    document.body.dataset.page = page;
    document.getElementById('eyebrow').textContent = card.eyebrow;
    document.getElementById('title').textContent = card.title;
    document.getElementById('tagline').textContent = card.tagline;
    document.getElementById('detail').textContent = card.detail;
    document.getElementById('url').textContent = card.url;
  </script>
</body>
</html>
